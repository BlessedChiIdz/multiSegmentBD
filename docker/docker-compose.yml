version: '3.8'

services:
  db1:
    image: postgres:15
    container_name: postgres_1
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # Монтируем скрипт
      - pg_data_1:/var/lib/postgresql/data # Сохраняем данные

  db2:
    image: postgres:15
    container_name: postgres_2
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data_2:/var/lib/postgresql/data

  db3:
    image: postgres:15
    container_name: postgres_3
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5434:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data_3:/var/lib/postgresql/data

  db4:
    image: postgres:15
    container_name: postgres_4
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5435:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data_4:/var/lib/postgresql/data

  db5:
    image: postgres:15
    container_name: postgres_5
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5436:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data_5:/var/lib/postgresql/data

volumes:
  pg_data_1:
  pg_data_2:
  pg_data_3:
  pg_data_4:
  pg_data_5: